
services:
  mysql:
    image: mysql:8.0
    container_name: db-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - sarra
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot12345"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: backend-container
    restart: always
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-student_management}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sarra
    command: sh -c "npm run seed-admin && npm start"

  frontend:
    build: ./frontend
    container_name: frontend-container
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://15.252.238.141:4000/api
    ports:
      - "5173:5173"
    networks:
      - sarra

networks:
  sarra:

volumes:
  mysql_data:
