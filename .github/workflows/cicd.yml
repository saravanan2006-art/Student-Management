
name: student-management

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-job:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Backend dependencies and tests
      - name: Set up Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check src/server.js

      - name: Run backend tests
        working-directory: backend
        run: npm test

      # Frontend dependencies and production build
      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Validate that both application images build
      - name: Build backend Docker image
        run: docker build -t student-backend:test ./backend

      - name: Build frontend Docker image
        run: docker build -t student-frontend:test ./frontend

  publish-images:
    name: Publish to Docker Hub
    needs: build-test-job
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            sarra006/student-backend:latest
            sarra006/student-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            sarra006/student-frontend:latest
            sarra006/student-frontend:${{ github.sha }}

 
deploy-pannu:
  name: Deploy to EC2
  needs: publish-images
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Copy Compose file to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST_API }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        port: 22
        source: docker-compose.yml
        target: /home/ubuntu/Student-Management

    - name: Deploy application
      uses: appleboy/ssh-action@v1
      env:
        IMAGE_TAG: ${{ github.sha }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_PASSWORD }}
      with:
        host: ${{ secrets.HOST_API }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        port: 22
        envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
        script: |
          set -e
          cd /home/ubuntu/Student-Management

          echo "=== Docker Compose configuration ==="
          docker compose config -q

          echo "=== Logging into Docker Hub ==="
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

          echo "=== Pulling backend and frontend images ==="
          docker compose pull backend frontend

          echo "=== Starting updated application ==="
          docker compose up -d --remove-orphans

          echo "=== Container status ==="
          docker compose ps

          echo "=== Backend logs ==="
          docker compose logs --tail=50 backend

          echo "=== Frontend logs ==="
          docker compose logs --tail=50 frontend

          docker logout
